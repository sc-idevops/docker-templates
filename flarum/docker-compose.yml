services:
  flarum:
    image: mondedie/flarum:latest
    container_name: flarum_core
    environment:
      - DEBUG=false
      - FORUM_URL=https://${domain}.theheart.land
      - UID=1000
      - GID=1000
      - DB_HOST=${domain}-mariadb
      - DB_NAME=flarum
      - DB_USER=flarum
      - DB_PASS=
      - DB_PREF=flarum_
      - DB_PORT=3306
      - FLARUM_ADMIN_USER=
      - FLARUM_ADMIN_PASS=
      - FLARUM_ADMIN_MAIL=
      - FLARUM_TITLE=
    volumes:
      - ./assets:/flarum/app/public/assets
      - ./extensions:/flarum/app/extensions
      - ./storage/logs:/flarum/app/storage/logs
      - ./nginx:/etc/nginx/flarum
    ports:
      - 8780:8888
    depends_on:
      - mariadb
    networks:
      - caddy
    labels:
      caddy: ${domain}.theheart.land
      caddy.reverse_proxy: "{{upstreams 8888}}"

  mariadb:
    image: mariadb:10.5
    container_name: flarum_mariadb
    environment:
      - MYSQL_ROOT_PASSWORD=
      - MYSQL_DATABASE=flarum
      - MYSQL_USER=flarum
      - MYSQL_PASSWORD=
      - UID=1000
      - GID=1000
    volumes:
      - ./mysql:/var/lib/mysql
    networks:
      caddy:
        aliases:
          - ${domain}-mariadb

networks:
  caddy:
    external: true

